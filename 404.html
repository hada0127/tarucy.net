<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 Not Found - Eunkyu Lee</title>
  <link rel="icon" type="image/x-icon" href="/resource/image/favicon.ico">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: "IBMPlexSansKR", system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .code {
      font-size: clamp(72px, 18vw, 160px);
      font-weight: 700;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #ff66aa, #50d0e0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 20px 0 32px; opacity: 0.7; font-size: 16px; }
    a {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff66aa, #50d0e0);
      color: #000;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <p>This page doesn't exist.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
